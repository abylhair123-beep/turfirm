<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d3836">
  <title>SAPAR — Нет подключения</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d3836;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 360px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.85;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      opacity: 0.75;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .retry-btn {
      display: inline-block;
      background: #ff7253;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 16px rgba(255, 114, 83, 0.4);
    }
    .retry-btn:active {
      transform: scale(0.96);
    }
    .brand {
      margin-top: 40px;
      font-size: 13px;
      opacity: 0.4;
      letter-spacing: 2px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✈️</div>
    <h1>Нет подключения</h1>
    <p>Проверьте интернет-соединение и попробуйте снова. Без сети SAPAR пока не может загрузить туры.</p>
    <button class="retry-btn" onclick="window.location.reload()">Попробовать снова</button>
    <div class="brand">SAPAR</div>
  </div>
</body>
</html>
