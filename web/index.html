<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="SAPAR — сервис поиска и бронирования туров по Казахстану и миру.">
  <meta name="theme-color" content="#0d3836">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SAPAR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SAPAR — Туры и Путешествия</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d3836;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: white;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #ff7253;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <div style="font-size: 22px; font-weight: 800; letter-spacing: 1.5px;">SAPAR</div>
    <div style="font-size: 14px; opacity: 0.75; margin-top: 6px;">Загрузка туров...</div>
  </div>

  <!-- PWA Install Prompt Banner for Mobile -->
  <div id="pwa-install-banner" style="display:none; position:fixed; bottom:24px; left:16px; right:16px; max-width:440px; margin:0 auto; background:rgba(13, 56, 54, 0.96); backdrop-filter:blur(12px); border:1px solid rgba(255,114,83,0.45); border-radius:18px; padding:12px 16px; box-shadow:0 12px 32px rgba(0,0,0,0.55); z-index:999999; font-family:-apple-system,BlinkMacSystemFont,sans-serif; color:white; align-items:center; gap:12px;">
    <img src="icons/Icon-192.png" style="width:46px; height:46px; border-radius:12px; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.35);" alt="SAPAR">
    <div style="flex:1; min-width:0;">
      <div style="font-weight:700; font-size:14px; color:#ffffff;">Приложение SAPAR</div>
      <div style="font-size:12px; color:rgba(255,255,255,0.75); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Иконка на экран телефона</div>
    </div>
    <button id="pwa-install-btn" style="background:#ff7253; color:white; border:none; border-radius:10px; padding:9px 14px; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0; box-shadow:0 2px 8px rgba(255,114,83,0.45);">
      Установить
    </button>
    <button id="pwa-close-btn" style="background:transparent; color:rgba(255,255,255,0.6); border:none; font-size:18px; cursor:pointer; padding:4px; line-height:1; flex-shrink:0;">
      ✕
    </button>
  </div>
  <script>
    let deferredPrompt = null;
    const banner = document.getElementById('pwa-install-banner');
    const installBtn = document.getElementById('pwa-install-btn');
    const closeBtn = document.getElementById('pwa-close-btn');

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    
    if (!isStandalone) {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        banner.style.display = 'flex';
      });

      setTimeout(() => {
        if (!isStandalone && banner.style.display !== 'flex') {
          if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            banner.style.display = 'flex';
          }
        }
      }, 2500);

      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            banner.style.display = 'none';
          }
          deferredPrompt = null;
        } else {
          const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
          if (isIOS) {
            alert('Чтобы установить иконку SAPAR:\n1. Нажмите иконку «Поделиться» (квадрат со стрелкой вверх) внизу Safari\n2. Выберите «На экран «Домой»');
          } else {
            alert('Чтобы установить иконку SAPAR:\n1. Нажмите на меню браузера (три точки ⋮ в правом верхнем углу)\n2. Выберите «Добавить на главный экран» или «Установить приложение»');
          }
        }
      });

      closeBtn.addEventListener('click', () => {
        banner.style.display = 'none';
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
